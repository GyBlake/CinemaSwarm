name: CinemaSwarm checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg and FFprobe for real episode rendering tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - run: python -m compileall -q cinema_swarm.py
      - name: Test everything including real MP4 assembly
        run: python -m pytest -q -rs
      - name: Verify executable episode renderer with actual media
        run: python -m pytest -q tests/test_episode_renderer.py -rs
      - name: Generate synthetic episode and technical receipt for review
        run: python -m scripts.create_episode_smoke
      - name: Upload inspectable sample MP4 and receipt
        uses: actions/upload-artifact@v4
        with:
          name: cinemaswarm-episode-smoke
          path: |
            build/smoke/smoke-episode.mp4
            build/smoke/receipt.json
            build/smoke/plan.json
          retention-days: 7
