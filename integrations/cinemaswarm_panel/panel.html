<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CinemaSwarm</title>
<style>
:root{color-scheme:dark;--paper:#15181b;--edge:#394147;--muted:#b6c1c5;--accent:#9febd7}
*{box-sizing:border-box}body{margin:0;background:#0e1113;color:#f1f4ef;font:15px/1.5 system-ui,sans-serif}
main{max-width:1000px;margin:auto;padding:clamp(18px,4vw,42px)}header{display:flex;justify-content:space-between;align-items:start;gap:16px;border-bottom:1px solid var(--edge);padding-bottom:18px}
h1{font-size:clamp(26px,5vw,40px);letter-spacing:-.06em;margin:0;line-height:1.1}h2{margin:0;font-size:20px}p{margin:8px 0;color:var(--muted)}
button{font:inherit;background:transparent;border:1px solid var(--edge);color:inherit;padding:7px 11px;border-radius:6px;cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px;margin-top:20px}
article{background:var(--paper);border:1px solid var(--edge);border-radius:9px;overflow:hidden}article section{padding:16px}.status{color:var(--accent);font:12px ui-monospace,monospace;margin:6px 0}
img,video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#0a0d0f}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
#notice{color:var(--accent);min-height:1.5em}summary{cursor:pointer;color:var(--muted)}li{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<header><div><h1>CinemaSwarm</h1><p id="context">The Echo Gate · shot review</p></div><button id="refresh" type="button">Refresh</button></header>
<p id="notice" role="status"></p>
<div id="shots"></div>
</main>
<script>
const pending = new Map();
let sequence = 0;
const notify = (method, params) => window.parent.postMessage({jsonrpc:"2.0", method, params}, "*");
function request(method, params) {
  const id = ++sequence;
  return new Promise((resolve, reject) => {
    const timeout = setTimeout(() => {
      pending.delete(id);
      reject(new Error("The host did not respond."));
    }, 35000);
    pending.set(id, {resolve, reject, timeout});
    window.parent.postMessage({jsonrpc:"2.0", id, method, params}, "*");
  });
}
function make(tag, text, parent) {
  const element = document.createElement(tag);
  if (text) element.textContent = text;
  parent.append(element);
  return element;
}
const notice = document.querySelector("#notice");
function render(data, previews = {}) {
  if (!Array.isArray(data?.shots)) return;
  const container = document.querySelector("#shots");
  container.replaceChildren();
  document.querySelector("#context").textContent = data.demo ? "The Echo Gate · example shots" : "Production · shot review";
  notice.textContent = data.demo ? "Load CinemaSwarm shot plans to review and render." :
    data.connected ? "" : "Connect ComfyUI to queue renders.";
  for (const shot of data.shots) {
    const card = make("article", "", container);
    const firstFrame = previews[shot.key];
    if (firstFrame) {
      const preview = make("img", "", card);
      preview.src = firstFrame;
      preview.alt = "First frame for " + shot.label;
    }
    if (shot.video) {
      const video = make("video", "", card);
      video.src = shot.video;
      video.controls = true;
      video.preload = "metadata";
    }
    const body = make("section", "", card);
    make("h2", shot.label, body);
    make("div", [shot.shot_id, shot.state].filter(Boolean).join(" · "), body).className = "status";
    make("p", shot.direction, body);
    if (!shot.key) continue;
    const references = make("details", "", body);
    make("summary", "Approved-source references", references);
    const list = make("ul", "", references);
    for (const ref of shot.references) make("li", ref.object_id, list);
    const actions = make("div", "", body);
    actions.className = "actions";
    const approve = make("button", shot.approved ? "Frame approved" : "Approve first frame", actions);
    approve.disabled = shot.approved || !firstFrame;
    approve.onclick = () => call("approve_frame", {key:shot.key}, approve);
    const queue = make("button", "Queue Wan render", actions);
    queue.disabled = !shot.approved || !data.connected || shot.state !== "Ready to queue";
    queue.onclick = () => call("queue_render", {key:shot.key}, queue);
  }
}
async function call(name, args = {}, button) {
  if (button) button.disabled = true;
  try {
    const result = await request("tools/call", {name, arguments:args});
    if (result.isError) throw new Error(result.content?.[0]?.text || "CinemaSwarm could not complete the action.");
    render(result.structuredContent, result._meta?.previews);
  } catch (error) {
    notice.textContent = error.message;
  } finally {
    if (button) button.disabled = false;
  }
}
window.addEventListener("message", event => {
  if (event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;
  const message = event.data;
  if (message.method === "ui/notifications/tool-result") render(message.params?.structuredContent, message.params?._meta?.previews);
  const entry = pending.get(message.id);
  if (!entry) return;
  clearTimeout(entry.timeout);
  pending.delete(message.id);
  if (message.error) entry.reject(new Error(message.error.message));
  else entry.resolve(message.result);
});
const refresh = document.querySelector("#refresh");
refresh.onclick = () => call("open_production", {}, refresh);
(async () => {
  if (window.parent === window) {
    refresh.disabled = true;
    render({demo:true,shots:[
      {shot_id:"EG-01",label:"Gate wide",direction:"Establish the near bank and the flooded threshold."},
      {shot_id:"EG-04",label:"Reverse reveal",direction:"Hold the gate geography as the second figure walks away."}
    ]});
    return;
  }
  try {
    await request("ui/initialize", {appInfo:{name:"CinemaSwarm",version:"0.1.0"},
      appCapabilities:{},protocolVersion:"2026-01-26"});
    notify("ui/notifications/initialized", {});
    await call("open_production");
  } catch (error) {
    notice.textContent = error.message;
  }
})();
</script>
</body>
</html>
